name: Publish
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: codeberg-medium
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Zine
        uses: https://github.com/kristoff-it/setup-zine@v2

      - name: Setup Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Fetch doc sources
        run: git clone --depth 1 https://codeberg.org/randyos/rstd.git ../rstd

      - name: Build
        run: zig build -Drstd=../rstd -p public

      - name: Copy Redirects and Headers
        run: |
          cp _redirects _headers public/

      - name: Deploy to Codeberg (randyos.org)
        uses: actions/git-pages@v2
        with:
          site: https://randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public/

      - name: Deploy to Codeberg (www.randyos.org)
        uses: actions/git-pages@v2
        with:
          site: https://www.randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public/

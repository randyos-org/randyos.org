name: Publish
on:
  push:
    branches: [main]
jobs:
  publish:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v7
      - run: |
          # Use your favorite static site generator here!
          mkdir _site
          cp *.html _site/
      - uses: actions/git-pages@v2
        with:
          site: https://randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: _site/
      - uses: actions/git-pages@v2
        with:
          site: https://www.randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: _site/

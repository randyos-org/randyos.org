name: Publish
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v7
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: |
          zig build
          cp _redirects _headers public/
      - uses: actions/git-pages@v2
        with:
          site: https://randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public/
      - uses: actions/git-pages@v2
        with:
          site: https://www.randyos.org/
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public/

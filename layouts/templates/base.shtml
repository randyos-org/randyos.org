<!DOCTYPE html>
<html>
	<head id="head">
		<meta charset="utf-8">
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<title :text="$site.title"></title>
		<link type="text/css" rel="stylesheet" href="$site.asset('fonts.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('navigation.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
		<!-- mathtex -->
		<link type="text/css" rel="stylesheet" href="$site.asset('Temml-Local.css').link()">
		<script defer src="$site.asset('temml.min.js').link()"></script>
		<script defer src="$site.asset('render-mathtex.js').link()"></script>
		<!-- /mathtex -->
		<script defer src="$site.asset('theme-toggle.js').link()"></script>
		<link rel="icon" href="$site.asset('logo/randyos-avatar-alphabg.png').link()">
		<link rel="icon" href="$site.asset('logo/randyos-avatar.svg').link()">
		<super>
	</head>
	<body id="body">
		<!-- <h1 class="site-title" :text="$site.title"></h1> -->
		<div class="container" style="display:flex; justify-content:space-between; align-items:center;">
			<a href="$site.link()">
				<img id="header-image" class="logo-img" src="$site.asset('logo/randyos-logo.svg').link()" alt="RandyOS Logo">
				<img id="header-image-light" class="logo-img" src="$site.asset('logo/randyos-logo-lightmode.svg').link()" alt="RandyOS Logo">
			</a>
			<button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
				<span>Toggle light/dark</span>
				<span class="icon-sun" aria-hidden="true">☀️</span>
				<span class="icon-moon" aria-hidden="true">🌙</span>
			</button>
		</div>
		<nav id="mobile-navbar" class="nav container">

				</svg>
			</label>
			<span style="overflow:hidden; max-width: 80%; display: inline-block; vertical-align:bottom;"
			      :text="$page.title"
			>
			</span>
		</nav>
		<div id="mobile-subnav">
			<input type="checkbox" name="mobile-toggle" id="mobile-toggle">

		</div>

					<a href="https://codeberg.org/randyos/randyos"
